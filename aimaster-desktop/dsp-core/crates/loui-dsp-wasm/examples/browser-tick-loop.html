<!DOCTYPE html>
<!--
  loui-dsp WASM tick-loop demo.

  Pre-requisite (run from the workspace root):

    wasm-pack build --release --target web crates/loui-dsp-wasm \
      --out-dir pkg

  Then serve this directory and open in a browser:

    cd crates/loui-dsp-wasm && python3 -m http.server 8080
    # browse http://localhost:8080/examples/browser-tick-loop.html

  The page wires a synthesised 440 Hz stereo sine through an AudioWorkletNode
  whose `process()` calls into the WASM analyzer.  Every 100 ms the worklet
  posts a MeterSnapshot to the main thread, which updates the DOM.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>loui-dsp — browser tick loop</title>
    <style>
      body { font-family: ui-monospace, monospace; background: #09090b; color: #d4d4d8;
              padding: 1.5rem; }
      h1 { font-weight: 500; color: #fafafa; margin-bottom: 1rem; }
      .meter { display: grid; grid-template-columns: 12rem 12rem; gap: 0.3rem 1rem;
               font-variant-numeric: tabular-nums; }
      .label { color: #71717a; }
      .value { color: #e4e4e7; }
      button { background: #27272a; color: #e4e4e7; padding: 0.5rem 1rem;
                border: 1px solid #3f3f46; border-radius: 0.375rem; cursor: pointer;
                font-family: inherit; margin-right: 0.5rem; }
      button:hover { background: #3f3f46; }
    </style>
  </head>
  <body>
    <h1>loui-dsp · realtime tick loop</h1>
    <div class="meter">
      <span class="label">version</span>          <span class="value" id="version">—</span>
      <span class="label">sample rate</span>      <span class="value" id="sr">—</span>
      <span class="label">samples</span>          <span class="value" id="samples">—</span>
      <span class="label">momentary LUFS</span>   <span class="value" id="m-lufs">—</span>
      <span class="label">short-term LUFS</span>  <span class="value" id="s-lufs">—</span>
      <span class="label">true peak (dBTP)</span> <span class="value" id="tp">—</span>
      <span class="label">sample peak (dBFS)</span><span class="value" id="peak">—</span>
      <span class="label">RMS (dBFS)</span>       <span class="value" id="rms">—</span>
      <span class="label">correlation</span>      <span class="value" id="corr">—</span>
      <span class="label">M/S ratio (dB)</span>   <span class="value" id="ms">—</span>
    </div>
    <p style="margin-top: 1rem;">
      <button id="start">▶ start</button>
      <button id="stop">⏸ stop</button>
    </p>

    <script type="module">
      // Imports rely on `wasm-pack build --target web` having produced
      // `pkg/loui_dsp_wasm.js` + `.wasm` in the same crate dir.
      import init, { LouiAnalyzer, crateVersion } from '../pkg/loui_dsp_wasm.js';

      const $ = (id) => document.getElementById(id);
      let ctx = null;
      let node = null;
      let analyzer = null;

      async function start() {
        await init();
        $('version').textContent = crateVersion();

        ctx = new AudioContext({ sampleRate: 48000 });
        $('sr').textContent = String(ctx.sampleRate);

        analyzer = new LouiAnalyzer(ctx.sampleRate, 2);

        // Build a simple WorkletProcessor that calls back to the main thread
        // every 100 ms.  AudioWorkletGlobalScope cannot directly import the
        // WASM module; instead we'll feed audio back to main via a ScriptProcessor
        // for simplicity in this demo (production uses AudioWorklet + sharedArrayBuffer).
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 440;

        const splitter = ctx.createChannelSplitter(2);
        const merger = ctx.createChannelMerger(2);
        osc.connect(merger, 0, 0);
        osc.connect(merger, 0, 1);
        merger.connect(splitter);

        // Use a tap node that copies audio into a JS-visible buffer.
        const sp = ctx.createScriptProcessor(2048, 2, 2);
        splitter.connect(sp, 0);
        splitter.connect(sp, 1);
        sp.onaudioprocess = (e) => {
          const l = e.inputBuffer.getChannelData(0);
          const r = e.inputBuffer.getChannelData(1);
          analyzer.processStereo(l, r);
          // Snapshot every 100 ms (every ~2.5 onaudioprocess at 48k/2048).
          const snap = analyzer.tickSnapshot;
        };
        sp.connect(ctx.destination);
        osc.start();

        // UI refresh at requestAnimationFrame cadence, throttled to ~60 Hz.
        let lastUi = 0;
        function tick(ts) {
          if (ts - lastUi >= 16) {
            const s = analyzer.tickSnapshot();
            $('samples').textContent = s.samplesProcessed.toLocaleString();
            $('m-lufs').textContent = fmt(s.momentaryLufs, 2);
            $('s-lufs').textContent = fmt(s.shortTermLufs, 2);
            $('tp').textContent     = fmt(s.truePeakDbtp, 2);
            $('peak').textContent   = fmt(s.samplePeakDb, 2);
            $('rms').textContent    = fmt(s.rmsDb, 2);
            $('corr').textContent   = fmt(s.correlation, 3);
            $('ms').textContent     = fmt(s.msRatioDb, 2);
            lastUi = ts;
          }
          if (ctx && ctx.state === 'running') requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }

      function stop() {
        if (!ctx) return;
        ctx.close();
        ctx = null;
        node = null;
        analyzer = null;
      }

      function fmt(v, digits) {
        if (!Number.isFinite(v)) return v < 0 ? '-∞' : 'NaN';
        return v.toFixed(digits);
      }

      $('start').addEventListener('click', start);
      $('stop').addEventListener('click', stop);
    </script>
  </body>
</html>
