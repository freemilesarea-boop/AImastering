[package]
name = "loui-dsp"
version = "0.1.0"
edition = "2021"
description = "Loui Mastering DSP core — realtime analyzers (M2-lite scope: FFT, LUFS, true peak, oversample, stereo, peak/RMS)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["rlib"]

# ── Zero external runtime dependencies in the default build — by design.
# ── Realtime audio code must not pull in transitive code we don't audit.
# ── The optional `serde` feature is deserialisation only, used by the WASM
# ── binding to accept a config object; it never runs on the audio thread.
[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]

# Dev-dependencies: WAV I/O for the cross-language parity example, and
# we do NOT depend on `criterion` (heavy + many transitive deps).  We
# ship a hand-rolled timing harness in benches/ so the suite has zero
# external runtime cost.
[dev-dependencies]

[[example]]
name = "analyze_wav"
path = "examples/analyze_wav.rs"

[[bench]]
name = "analyzer_bench"
harness = false
path = "benches/analyzer_bench.rs"
