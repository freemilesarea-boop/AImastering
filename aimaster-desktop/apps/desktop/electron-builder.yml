appId: com.louver.mastering
productName: Louver Mastering AI
copyright: Copyright © 2025 루베르

directories:
  output: out
  buildResources: public

# ── App files ─────────────────────────────────────────────────────────────────
files:
  - dist/**/*
  - "!dist/renderer/**/*.map"   # strip source maps from production build

# ── Bundled native binaries ───────────────────────────────────────────────────
# public/bin/ is populated by scripts/prebuild.cjs (FFmpeg) and
# the build scripts (PyInstaller engine).  All three binaries land in
# Resources/bin/ inside the final app bundle.
extraResources:
  - from: "public/bin"
    to: "bin"
    filter:
      - "**/*"

# ── macOS ─────────────────────────────────────────────────────────────────────
mac:
  category: public.app-category.music
  # electron-builder converts icon.png → .icns automatically on macOS
  icon: public/icon.png
  target:
    - target: dmg
      arch:
        - arm64   # Apple Silicon (M1/M2/M3)
        - x64     # Intel Mac
  hardenedRuntime: true
  entitlements: public/entitlements.mac.plist
  entitlementsInherit: public/entitlements.mac.plist
  # PyInstaller engine binary must be executable — electron-builder signs it
  extraFiles: []

dmg:
  title: "Louver Mastering AI"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ── Windows ───────────────────────────────────────────────────────────────────
win:
  icon: public/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    # Portable .exe — fallback artifact in case NSIS packaging fails on the
    # GitHub Actions Windows runner (its node_modules pathing has historically
    # blown past 260-char MAX_PATH on pnpm + electron-builder).  Portable
    # builds skip the makensis step entirely, so they're a guaranteed deliverable.
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: public/icon.ico
  uninstallerIcon: public/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Louver Mastering AI"

portable:
  artifactName: "Louver Mastering AI Portable ${version}.${ext}"

# ── Linux (optional AppImage) ─────────────────────────────────────────────────
linux:
  category: Audio
  icon: public/icon.png
  target:
    - AppImage
