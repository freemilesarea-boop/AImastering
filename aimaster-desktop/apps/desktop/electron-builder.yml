appId: com.louver.mastering
productName: LV DAW
copyright: Copyright © 2025 루베르

# Pin electron version explicitly so electron-builder doesn't fall back to
# inferring from node_modules (which fails when ranges + monorepo hoisting
# leave the resolution ambiguous).  Must match apps/desktop/package.json
# devDependencies.electron and the root pnpm.overrides entry.
electronVersion: 28.3.3

directories:
  output: out
  buildResources: public

# ── Update server (v3.4.3 — electron-updater) ─────────────────────────────────
# GitHub Releases is the update channel.  electron-builder generates and
# uploads the metadata files (latest.yml / latest-mac.yml / latest-linux.yml)
# alongside the platform installers.  electron-updater on the client reads
# those YAMLs to discover new versions.
#
# The client only sends an HTTPS GET to the public release endpoint, so as
# long as the repo is PUBLIC no token is required at runtime.  If the repo
# becomes private, every client must set GH_TOKEN with a personal access
# token that has `repo` scope — see src/main/updater.ts for the TODO.
#
# The CI workflow controls whether `--publish always` actually uploads
# artefacts (only on tag pushes).  This block just tells the client which
# server to query.
publish:
  provider: github
  owner:    freemilesarea-boop
  repo:     AImastering
  # 'draft' so the existing release-draft workflow job (which also targets
  # this tag with the human-readable release notes) doesn't collide with a
  # finalized release that electron-builder created.  After both jobs run,
  # a maintainer reviews the draft and clicks Publish.  Once published,
  # electron-updater clients see the new version on their next check.
  releaseType: draft

# ── App files (v3.4.2 layout) ────────────────────────────────────────────────
files:
  - dist/**/*
  - dist-electron/**/*
  - "!dist/renderer/**/*.map"

  # ── node_modules: nothing, except what is read at runtime ────────────────
  #
  # electron-builder puts every production dependency in the asar on its own,
  # whatever this list says, so naming one file here ADDS that file — it does
  # not subtract the rest.  That is how `onnxruntime-web` got in: the list
  # carried four of its build variants on the assumption that the renderer
  # imports the package at runtime, and the package shipped whole besides.
  # Measured on the packaged tree:
  #
  #     asar content total                     165.2 MB
  #       node_modules/onnxruntime-web/dist    134.4 MB
  #       node_modules/onnxruntime-web/lib       3.0 MB
  #       everything else under node_modules    21.4 MB
  #
  # None of it is loaded as a module.  `esbuild.main.cjs` bundles the main
  # process, the plugin host and the preload with only the specifiers in its
  # EXTERNAL list left out, and vite bundles the renderer and its workers.
  # Measured on the three built bundles rather than assumed: the only bare
  # specifiers reachable by `require` are node builtins, `electron` and
  # `node-machine-id`, there is no `require` with a computed argument and no
  # `import()` of a computed specifier.  (`require("ajv/dist/runtime/equal")`
  # does appear — inside a string literal that ajv hands to callers who ask
  # for standalone code.  Nothing here asks.)
  #
  # So node_modules is excluded wholesale and the two things that are read at
  # runtime are put back.  Order matters: the later pattern wins.
  - "!node_modules/**/*"

  # Read as a FILE, not as a module: `daw:model-runtime` in
  # src/main/ipc/fileHandlers.ts joins node_modules/onnxruntime-web/dist/<name>
  # and hands the bytes to the model worker, which has the runtime's
  # JavaScript bundled in (dist/renderer/model.worker.js) and takes the
  # binary through `env.wasm.wasmBinary` — so no path has to resolve and
  # `wasmPaths` is irrelevant.  12.9 MB, and the only variant that is asked
  # for.  A packaging run drives the channel and checks the size that comes
  # back (scripts/app-smoke/flow-packaged.mjs).
  - node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm

  # Required as a MODULE, because esbuild leaves it external — it reads the
  # machine id by shelling out, and the licence binding calls it.  Anything
  # added to EXTERNAL in esbuild.main.cjs needs a line like this one, or the
  # app breaks in a packaged build only; asar-payload-selftest.ts fails when
  # one is missing.
  - node_modules/node-machine-id/**/*

# ── ASAR layout ──────────────────────────────────────────────────────────────
# Default asar:true is kept — the main process reads .worklet.js / .wasm via
# Node fs (handles asar transparently) and ships the bytes to the renderer
# over IPC (see loui:read-worklet-asset in main/index.ts).  However,
# Chromium's renderer-side fetch() of `new URL('loui_dsp_wasm_bg.wasm',
# import.meta.url)` (the wasm-bindgen default path inside @loui/dsp-wasm's
# generated JS) goes through file:// directly, which has historically
# misbehaved inside app.asar.  Unpacking the .wasm + worklet assets keeps
# both code paths working — the IPC bridge stays the primary loader, but
# any fallback fetch lands on a real on-disk file.
asarUnpack:
  - "dist/renderer/assets/*.wasm"
  - "dist/renderer/*.worklet.js"
  - "dist/renderer/assets/*.worklet.js"

extraMetadata:
  main: dist-electron/main/index.js

# ── Bundled native binaries ───────────────────────────────────────────────────
#
# `.node` addons must stay OUTSIDE app.asar: `dlopen` needs a real path on
# disk, and an addon inside the archive cannot be loaded at all.  So the AU
# host goes in extraResources, not in `files`, and `auCandidates()` in
# src/main/plugins/au-native.ts looks for it at exactly this path.
#
# The `from:` directory only exists after `pnpm build:au` has been run on a
# Mac.  electron-builder skips a missing extraResources entry, so a build on
# Linux or Windows — where there is no AU hosting anyway — is unaffected.
extraResources:
  # The node-target WASM MasteringChain — the offline render engine.
  #
  # It was in NO packaging list, while the main process looked for it at
  # `resources/dsp-wasm-node`.  So `isRustOfflineAvailable()` was false in
  # every packaged build, every Studio render fell back to an engine that
  # cannot read a chain config, and the master came out as if nothing had
  # been set.  `to:` must stay equal to WASM_NODE_RESOURCE_DIR in
  # src/main/offline/load-mastering-chain-node.ts — a selftest checks it.
  #
  # Outside app.asar on purpose: the glue `require`s its .wasm sibling by
  # real path.
  - from: "../../packages/dsp-wasm/pkg-node"
    to:   "dsp-wasm-node"
    filter:
      - "*.cjs"
      - "*.wasm"
  - from: "public/bin"
    to:   "bin"
    filter:
      - "**/*"
  - from: "native/au-host/build/Release"
    to:   "au-host"
    filter:
      - "*.node"

# ── macOS ─────────────────────────────────────────────────────────────────────
# v3.4.3 — DMG + ZIP both built.  electron-updater on macOS reads the .zip
# delta from latest-mac.yml; the .dmg is the user-friendly first-install
# format (drag-to-Applications).
#
# !! IMPORTANT: macOS auto-update REQUIRES a code-signed AND notarized .app
# inside the .zip.  Without notarization, the OS Gatekeeper refuses to launch
# the replacement process and electron-updater reports
# "Could not get code signature for running application".
#
# TODO (v3.5): wire CSC_LINK / CSC_KEY_PASSWORD + Apple notarization
# (notarytool) to enable macOS auto-update.  Until that lands, mac auto-
# update will fail gracefully with an error event the renderer surfaces.
mac:
  category: public.app-category.music
  icon: public/icon.png
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  entitlements:        public/entitlements.mac.plist
  entitlementsInherit: public/entitlements.mac.plist
  # identity: "Developer ID Application: <NAME> (<TEAM_ID>)"   # ← TODO v3.5
  extraFiles: []

dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"

# ── Windows ───────────────────────────────────────────────────────────────────
# v3.4.4 — NSIS only.  Portable target removed: portable .exe cannot self-
# update (electron-updater requires an installer that knows where to write
# the new binary), and shipping both confused users about which one was
# the "official" download.  Users on locked-down systems can fall back to
# Linux AppImage or extract the NSIS installer manually.
win:
  icon: public/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "${productName}"
  artifactName: "${productName}-Setup-${version}.${ext}"

# ── Filename templates (all targets) ──────────────────────────────────────────
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

# ── Linux (AppImage + deb) ────────────────────────────────────────────────────
# AppImage — universal, runs on any distro without install, auto-updateable
#            via electron-updater (reads latest-linux.yml).
# deb       — Debian/Ubuntu native package, installs to /opt, registers a
#             .desktop entry and MIME type automatically.
linux:
  category: Audio
  icon: public/icon.png
  # Required by the .deb (fpm) target — without a maintainer the deb build
  # aborts ("It is required to set Linux .deb package maintainer").  Uses the
  # GitHub noreply address so no personal email is committed.
  maintainer: Louver <251591504+freemilesarea-boop@users.noreply.github.com>
  mimeTypes:
    - audio/wav
    - audio/x-wav
    - audio/flac
    - audio/x-flac
    - audio/aiff
    - audio/x-aiff
    - audio/mpeg
    - audio/mp4
  desktop:
    Name: LV DAW
    Comment: Multitrack DAW with AI mastering
    Categories: Audio;AudioVideo;Music;
    Keywords: daw;multitrack;mastering;audio;music;lv;
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
