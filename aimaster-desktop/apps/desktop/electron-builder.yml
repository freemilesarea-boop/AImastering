appId: com.louver.mastering
productName: Louver Mastering AI
copyright: Copyright © 2025 루베르

# Pin electron version explicitly so electron-builder doesn't fall back to
# inferring from node_modules (which fails when ranges + monorepo hoisting
# leave the resolution ambiguous).  Must match apps/desktop/package.json
# devDependencies.electron and the root pnpm.overrides entry.
electronVersion: 28.3.3

directories:
  output: out
  buildResources: public

# ── App files ─────────────────────────────────────────────────────────────────
# Layout (v3.4.2):
#   dist/renderer/        — Vite output (index.html + JS bundles)
#   dist-electron/main/   — esbuild output (Electron main process)
#   dist-electron/preload/ — esbuild output (Electron preload)
# Renderer's dist/ and main's dist-electron/ are kept separate so that
# CI cleanup steps that wipe one don't accidentally wipe the other.
files:
  - dist/**/*
  - dist-electron/**/*
  - "!dist/renderer/**/*.map"   # strip source maps from production build

# Force the asar's main entry to the new location regardless of any other
# package.json that might leak through monorepo hoisting.  electron-builder
# overwrites package.json's `main` field inside the asar with this value.
extraMetadata:
  main: dist-electron/main/index.js

# ── Bundled native binaries ───────────────────────────────────────────────────
# public/bin/ is populated by scripts/prebuild.cjs (FFmpeg) and
# the build scripts (PyInstaller engine).  All three binaries land in
# Resources/bin/ inside the final app bundle.
extraResources:
  - from: "public/bin"
    to: "bin"
    filter:
      - "**/*"

# ── macOS ─────────────────────────────────────────────────────────────────────
# zip target only.  DMG is intentionally disabled — the GitHub Actions macOS
# runner has been failing on `hdiutil attach` ("no mountable file systems")
# during DMG packaging.  zip ships an unsigned .app archive that Mac users
# can run directly after right-click → Open the first time.
# DMG will be revisited on a separate branch.
mac:
  category: public.app-category.music
  # electron-builder converts icon.png → .icns automatically on macOS
  icon: public/icon.png
  target:
    - target: zip
      arch:
        - arm64   # Apple Silicon (M1/M2/M3)
        - x64     # Intel Mac
  hardenedRuntime: true
  entitlements: public/entitlements.mac.plist
  entitlementsInherit: public/entitlements.mac.plist
  # PyInstaller engine binary must be executable — electron-builder signs it
  extraFiles: []

# ── Windows ───────────────────────────────────────────────────────────────────
# Portable target only.  NSIS is intentionally disabled because the GitHub
# Actions Windows runner cannot package it (pnpm + electron-builder peer-deps
# produce node_modules\.pnpm\<peers-hash>\... paths that exceed Windows' 260-char
# MAX_PATH).  NSIS will be revisited on a separate branch; this branch ships
# the portable .exe so the Windows app is usable now.
win:
  icon: public/icon.ico
  target:
    - target: portable
      arch:
        - x64

portable:
  artifactName: "Louver-Mastering-AI-${version}-portable-${arch}.${ext}"

# ── Filename templates (all targets) ──────────────────────────────────────────
# Embed version + arch so multi-platform release artifacts don't collide.
artifactName: "Louver-Mastering-AI-${version}-${os}-${arch}.${ext}"

# ── Linux (optional AppImage) ─────────────────────────────────────────────────
linux:
  category: Audio
  icon: public/icon.png
  target:
    - AppImage
