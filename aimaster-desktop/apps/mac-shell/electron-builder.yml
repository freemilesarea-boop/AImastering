# macOS packaging for the mobile-style server-mastering app (apps/mac-shell).
# Separate appId from the desktop engine app (com.louver.mastering) and the
# Android app (com.louver.mastering.mobile) to avoid collisions.
appId: com.louver.mastering.mac
productName: Loui Mastering
copyright: Copyright © 2026 루베르
electronVersion: 28.3.3

directories:
  output: out

# This app has NO runtime node dependencies (pure web SPA in www/ + a tiny
# main.cjs using only built-in electron modules). Skip electron-builder's
# "install production dependencies" step — under pnpm it runs a prod install
# that prunes the workspace's devDeps (incl. electron-builder's own 7zip-bin),
# which then breaks dmg/zip packaging with `ENOENT chmod .../7zip-bin/...`.
npmRebuild: false
nodeGypRebuild: false

# Pure web + tiny main process — no node deps to bundle.
files:
  - main.cjs
  - www/**/*

extraMetadata:
  main: main.cjs

# ── macOS: dmg (drag-to-Applications) + zip, Apple Silicon (arm64) + Intel (x64).
# NOT code-signed / notarized yet → Gatekeeper shows an "unidentified developer"
# warning; right-click → Open (once). See docs/MACOS_MOBILE_APP.md.
mac:
  category: public.app-category.music
  icon: icon.png
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # identity: "Developer ID Application: <NAME> (<TEAM_ID>)"   # TODO when signing

dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"

artifactName: "${productName}-${version}-${arch}.${ext}"
