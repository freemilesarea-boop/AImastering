# DEPRECATED — apps/mac-shell is NOT a shipping target.
#
# The mac-shell wrapper runs the mobile SPA's on-device Web Audio mastering in a
# Chromium renderer, which SIGSEGVs on macOS (render-process-gone exitCode:11,
# GPU on/off). That cannot be fixed in JS and cannot be moved off the renderer
# (Node has no Web Audio). macOS ships via apps/desktop (build.yml). This
# workflow is kept manual-only (workflow_dispatch) for archival/diagnostics and
# NO LONGER auto-builds on push. Does NOT touch apps/desktop, the Android
# workflow, the server, or python-audio.
name: Build macOS Mobile App (DEPRECATED — manual only)

on:
  # Auto (push) triggers removed: mac-shell is deprecated and must not ship.
  workflow_dispatch:
    inputs:
      version_name:
        description: 'app version (e.g. 1.0.0) — diagnostics build only'
        required: false
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: mac-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac-mobile:
    name: macOS app (dmg + zip, arm64 + x64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: aimaster-desktop/pnpm-lock.yaml

      - name: Install dependencies (clean — materializes electron-builder binaries)
        working-directory: aimaster-desktop
        # A clean tree + --no-frozen-lockfile is required so pnpm's hoisted linker
        # fully materializes electron-builder's platform binaries (7zip-bin,
        # app-builder-bin). --frozen-lockfile left 7zip-bin/mac/* missing → the
        # `Package` step failed with `ENOENT chmod .../7zip-bin/mac/arm64/7za`.
        # Mirrors the working recipe in build.yml's build-mac job.
        run: |
          rm -rf node_modules apps/*/node_modules packages/*/node_modules
          pnpm install --no-frozen-lockfile

      - name: Verify 7zip-bin macOS binaries (electron-builder dependency)
        working-directory: aimaster-desktop
        run: |
          SZ=node_modules/7zip-bin
          if [ ! -e "$SZ/mac/arm64/7za" ] || [ ! -e "$SZ/mac/x64/7za" ]; then
            echo "::error::7zip-bin macOS binaries missing — electron-builder dmg/zip packaging will fail."
            echo "Expected: $(pwd)/$SZ/mac/{arm64,x64}/7za"
            ls -laR "$SZ" 2>/dev/null | head -60 || echo "(7zip-bin not installed at all)"
            exit 1
          fi
          chmod +x "$SZ/mac/arm64/7za" "$SZ/mac/x64/7za" || true
          echo "OK — 7zip-bin macOS binaries present:"
          ls -la "$SZ/mac/arm64/7za" "$SZ/mac/x64/7za"

      - name: Build mobile SPA (Vite)
        working-directory: aimaster-desktop/apps/mobile
        env:
          # On-device mastering (Web Audio) — NO server/Render env injected.
          VITE_APP_VERSION: ${{ github.event.inputs.version_name || '1.0.0' }}
        run: pnpm run build

      - name: Package macOS app (.dmg + .zip)
        working-directory: aimaster-desktop/apps/mac-shell
        run: pnpm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loui-mastering-mac
          path: |
            aimaster-desktop/apps/mac-shell/out/*.dmg
            aimaster-desktop/apps/mac-shell/out/*.zip
          if-no-files-found: error
