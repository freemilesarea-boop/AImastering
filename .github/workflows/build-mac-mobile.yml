# Packages the apps/mobile server-mastering app as a macOS .dmg/.zip via the
# apps/mac-shell Electron wrapper (no local python engine).
#
# Scope: mobile-style macOS app only. Does NOT touch the desktop engine app
# (apps/desktop / build.yml), the Android workflow, the server, or python-audio.
name: Build macOS Mobile App

on:
  push:
    branches:
      - claude/gifted-babbage-6bd4gc
    paths:
      - 'aimaster-desktop/apps/mobile/**'
      - 'aimaster-desktop/apps/mac-shell/**'
      - '.github/workflows/build-mac-mobile.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'test (server settings shown) or release (settings hidden, env-injected)'
        required: false
        type: choice
        options: [test, release]
        default: test
      version_name:
        description: 'app version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: mac-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac-mobile:
    name: macOS app (dmg + zip, arm64 + x64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: aimaster-desktop/pnpm-lock.yaml

      - name: Install dependencies (clean — materializes electron-builder binaries)
        working-directory: aimaster-desktop
        # A clean tree + --no-frozen-lockfile is required so pnpm's hoisted linker
        # fully materializes electron-builder's platform binaries (7zip-bin,
        # app-builder-bin). --frozen-lockfile left 7zip-bin/mac/* missing → the
        # `Package` step failed with `ENOENT chmod .../7zip-bin/mac/arm64/7za`.
        # Mirrors the working recipe in build.yml's build-mac job.
        run: |
          rm -rf node_modules apps/*/node_modules packages/*/node_modules
          pnpm install --no-frozen-lockfile

      - name: Verify 7zip-bin macOS binaries (electron-builder dependency)
        working-directory: aimaster-desktop
        run: |
          SZ=node_modules/7zip-bin
          if [ ! -e "$SZ/mac/arm64/7za" ] || [ ! -e "$SZ/mac/x64/7za" ]; then
            echo "::error::7zip-bin macOS binaries missing — electron-builder dmg/zip packaging will fail."
            echo "Expected: $(pwd)/$SZ/mac/{arm64,x64}/7za"
            ls -laR "$SZ" 2>/dev/null | head -60 || echo "(7zip-bin not installed at all)"
            exit 1
          fi
          chmod +x "$SZ/mac/arm64/7za" "$SZ/mac/x64/7za" || true
          echo "OK — 7zip-bin macOS binaries present:"
          ls -la "$SZ/mac/arm64/7za" "$SZ/mac/x64/7za"

      - name: Build mobile SPA (Vite)
        working-directory: aimaster-desktop/apps/mobile
        env:
          # release: hide settings UI + inject server from env. test (default):
          # settings UI shown. Key is ALWAYS a Secret. (mac-shell loads this dist)
          VITE_RELEASE_MODE: ${{ github.event.inputs.build_type == 'release' && 'true' || 'false' }}
          VITE_MASTERING_API_URL: ${{ github.event.inputs.build_type == 'release' && 'https://aimastering.onrender.com' || (vars.VITE_MASTERING_API_URL || secrets.VITE_MASTERING_API_URL) }}
          VITE_MASTERING_API_KEY: ${{ secrets.VITE_MASTERING_API_KEY }}
          VITE_APP_VERSION: ${{ github.event.inputs.version_name || '1.0.0' }}
        run: pnpm run build

      - name: Package macOS app (.dmg + .zip)
        working-directory: aimaster-desktop/apps/mac-shell
        run: pnpm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loui-mastering-mac
          path: |
            aimaster-desktop/apps/mac-shell/out/*.dmg
            aimaster-desktop/apps/mac-shell/out/*.zip
          if-no-files-found: error
