name: Build Louver Mastering AI — macOS Intel (x64)

# ── Why this workflow exists ──────────────────────────────────────────────────
# v3.6.0 shipped a macOS x64 build that Finder correctly identified as
# "종류: 응용 프로그램(Intel)" but that would not run on an actual Intel Mac.
#
# The cause was NOT the Electron shell — that really was x64.  build.yml's
# `build-mac` job runs on an Apple Silicon runner and packaged both
# architectures in a single `electron-builder --mac dmg zip --x64 --arm64`
# invocation.  electron-builder swaps the Electron shell per arch, but
# `extraResources` is arch-blind: whatever sits in apps/desktop/public/bin at
# package time is copied verbatim into EVERY arch's bundle.  Those sidecars are
# produced on the runner, so they were all arm64:
#
#   • public/bin/engine    ← PyInstaller, built on the runner
#   • public/bin/ffmpeg    ← require('ffmpeg-static')
#   • public/bin/ffprobe   ← @ffprobe-installer/ffprobe
#
# Rosetta 2 translates x64 → arm64, never the reverse, so on an Intel Mac none
# of them can execute.  The main process resolves them at startup
# (main/utils/ffmpegEnv.ts → Resources/bin/ffmpeg) and `checkFFmpeg()` fails
# before a window is shown.
#
# ── Why this cross-builds instead of using an Intel runner ────────────────────
# The obvious fix — build on an Intel runner — is no longer available for free.
# `macos-13` was the last free GitHub-hosted Intel image and has been retired
# (a job requesting it now queues forever rather than failing).  Every
# remaining x86_64 macOS label (`macos-15-intel`, `macos-26-intel`,
# `macos-*-large`) is a paid larger runner.
#
# So we cross-build on the free arm64 runner and source each arch-sensitive
# piece explicitly for x86_64:
#
#   • Electron shell → electron-builder downloads the darwin-x64 dist itself,
#                      driven purely by the --x64 flag.  Never host-dependent.
#   • ffmpeg         → `npm_config_arch=x64` makes ffmpeg-static's install
#                      script fetch ffmpeg-darwin-x64 (it reads that env var
#                      before falling back to os.arch()).
#   • ffprobe        → @ffprobe-installer/darwin-x64 installed directly, at the
#                      exact version pnpm-lock.yaml already pins.
#   • engine         → PyInstaller cannot cross-compile, so we install a real
#                      x86_64 CPython via uv and freeze under Rosetta 2.
#
# Cross-building is only safe because it is verified, not assumed:
# scripts/verify-mac-arch.cjs walks every Mach-O inside the packaged .app and
# fails the build if anything lacks an x86_64 slice or if a sidecar is missing.
# If any step above silently produced arm64, this job goes red instead of
# publishing another Intel build that dies on launch.

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
    paths-ignore:
      - 'aimaster-desktop/apps/mobile/**'
      - 'aimaster-desktop/apps/mac-shell/**'
      - 'aimaster-desktop/services/mastering-api/**'
      - 'docs/**'
      - 'render.yaml'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      release_tag:
        description: |
          이 빌드를 붙일 GitHub Release tag (기본 v3.6.0-intel).
          같은 tag 로 다시 실행하면 첨부 파일이 갱신됩니다.
        required: false
        type: string
        default: 'v3.6.0-intel'

# A new push supersedes whatever is still queued or running for the same ref.
concurrency:
  group: mac-intel-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the versions pnpm-lock.yaml already resolves, so the x64 binaries
  # we stage are the same builds the arm64 pipeline ships — only the arch
  # differs.
  FFMPEG_STATIC_VERSION: '5.3.0'
  FFPROBE_DARWIN_X64_VERSION: '5.1.0'
  PYINSTALLER_VERSION: '6.11.1'

jobs:
  build-mac-intel:
    name: Build (cross-compile → Intel x86_64)
    runs-on: macos-15          # arm64 host; every x64 artefact is sourced explicitly below
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # PyInstaller has to *execute* the target interpreter to freeze it, so an
      # x86_64 CPython must be runnable here.  Rosetta 2 is preinstalled on the
      # GitHub arm64 macOS images; prove it before spending 20 minutes.
      - name: Assert Rosetta 2 can execute x86_64
        run: |
          set -e
          echo "host arch : $(uname -m)"
          echo "macOS     : $(sw_vers -productVersion)"
          softwareupdate --install-rosetta --agree-to-license 2>/dev/null || true
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo ""
            echo "✗ Cannot execute x86_64 binaries on this runner."
            echo "  Rosetta 2 is required to freeze the Python engine for Intel."
            exit 1
          fi
          echo "✓ Rosetta 2 available"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@9

      # ── Python engine, frozen as x86_64 ──────────────────────────────────────
      # actions/setup-python only serves arm64 interpreters on arm64 runners, so
      # we pull a genuine x86_64 CPython from python-build-standalone via uv and
      # run the whole pip + PyInstaller chain against it.  Because that
      # interpreter is thin x86_64, every wheel pip resolves is x86_64 too, and
      # PyInstaller emits an x86_64 binary.
      - name: Install uv
        run: |
          set -e
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create x86_64 Python 3.11 environment
        working-directory: aimaster-desktop/services/python-audio
        run: |
          set -e
          uv python install cpython-3.11-macos-x86_64-none
          uv venv --python cpython-3.11-macos-x86_64-none .venv-x64
          echo "=== interpreter arch (must be x86_64) ==="
          lipo -archs .venv-x64/bin/python3 || file .venv-x64/bin/python3
          .venv-x64/bin/python3 -c "import platform; print('python reports:', platform.machine())"
          .venv-x64/bin/python3 -c "import platform,sys; sys.exit(0 if platform.machine()=='x86_64' else 1)" \
            || { echo "✗ uv gave us a non-x86_64 interpreter"; exit 1; }

      - name: Install Python dependencies + PyInstaller (x86_64)
        working-directory: aimaster-desktop/services/python-audio
        run: |
          set -e
          uv pip install --python .venv-x64/bin/python3 -r requirements.txt
          # Pin PyInstaller to 6.11.x — last release tested against the
          # numpy<2 / soundfile 0.13 combination this engine ships with.
          uv pip install --python .venv-x64/bin/python3 "pyinstaller==${PYINSTALLER_VERSION}"
          uv pip list --python .venv-x64/bin/python3

      - name: Build Python engine (PyInstaller · x86_64)
        working-directory: aimaster-desktop/services/python-audio
        run: |
          set -e
          mkdir -p ../../apps/desktop/public/bin
          arch -x86_64 .venv-x64/bin/python3 -m PyInstaller \
            --clean --noconfirm --onefile --name engine \
            --log-level INFO \
            --target-arch x86_64 \
            --distpath ../../apps/desktop/public/bin \
            --workpath /tmp/pyinstaller-build \
            --specpath /tmp/pyinstaller-spec \
            --hidden-import soundfile \
            --hidden-import numpy \
            --collect-all soundfile \
            --collect-all numpy \
            --exclude-module tkinter \
            --exclude-module pytest \
            --exclude-module matplotlib \
            app/main.py
          chmod +x ../../apps/desktop/public/bin/engine
          echo "=== engine arch ==="
          lipo -archs ../../apps/desktop/public/bin/engine
          lipo -archs ../../apps/desktop/public/bin/engine | grep -q x86_64 \
            || { echo "✗ engine is not x86_64"; exit 1; }

      # ── ffmpeg / ffprobe for darwin-x64 ─────────────────────────────────────
      # Staged in a throwaway package so the main pnpm install (which must stay
      # host-native — it also builds the renderer) is untouched.
      #   ffmpeg-static  reads npm_config_arch before falling back to os.arch()
      #   @ffprobe-installer/darwin-x64  is the per-arch package @ffprobe-
      #     installer/ffprobe would pick on a real Intel machine; --cpu/--os
      #     override npm's EBADPLATFORM check on this arm64 host.
      - name: Stage darwin-x64 ffmpeg + ffprobe
        run: |
          set -e
          mkdir -p /tmp/x64bins
          cd /tmp/x64bins
          npm init -y >/dev/null
          npm_config_arch=x64 npm_config_platform=darwin \
            npm install --no-save --cpu=x64 --os=darwin \
              "ffmpeg-static@${FFMPEG_STATIC_VERSION}" \
              "@ffprobe-installer/darwin-x64@${FFPROBE_DARWIN_X64_VERSION}"

          FFMPEG_BIN=$(node -p "require('/tmp/x64bins/node_modules/ffmpeg-static')")
          FFPROBE_BIN=$(find /tmp/x64bins/node_modules/@ffprobe-installer/darwin-x64 -type f -name ffprobe | head -1)

          echo "ffmpeg : $FFMPEG_BIN"
          echo "ffprobe: $FFPROBE_BIN"
          test -n "$FFPROBE_BIN" || { echo "✗ ffprobe binary not found in the staged package"; exit 1; }

          echo "=== staged arch ==="
          lipo -archs "$FFMPEG_BIN"
          lipo -archs "$FFPROBE_BIN"
          lipo -archs "$FFMPEG_BIN"  | grep -q x86_64 || { echo "✗ ffmpeg is not x86_64";  exit 1; }
          lipo -archs "$FFPROBE_BIN" | grep -q x86_64 || { echo "✗ ffprobe is not x86_64"; exit 1; }

          echo "FFMPEG_BINARY=$FFMPEG_BIN"   >> "$GITHUB_ENV"
          echo "FFPROBE_BINARY=$FFPROBE_BIN" >> "$GITHUB_ENV"

      - name: Install Node dependencies (clean)
        working-directory: aimaster-desktop
        run: |
          rm -rf node_modules apps/desktop/node_modules packages/*/node_modules
          pnpm store prune || true
          pnpm install --no-frozen-lockfile

      # Copies the staged x64 binaries into public/bin.  AIMASTER_TARGET_ARCH
      # makes prebuild.cjs re-assert each copy carries an x86_64 slice, and it
      # checks the already-staged engine too.
      - name: Copy FFmpeg binaries (arch-checked)
        working-directory: aimaster-desktop/apps/desktop
        env:
          AIMASTER_TARGET_ARCH: x64
        run: node scripts/prebuild.cjs

      - name: Clean previous out/ + dist*/ before build
        working-directory: aimaster-desktop/apps/desktop
        run: rm -rf out dist dist-electron

      - name: Build Electron app
        working-directory: aimaster-desktop/apps/desktop
        env:
          AUTO_UPDATE_ENABLED: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          VITE_LOUI_GUIDED_FLOW: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
        run: pnpm build

      - name: Verify build outputs (renderer + main + preload)
        working-directory: aimaster-desktop/apps/desktop
        run: |
          set -e
          test -f dist/renderer/index.html       || { echo "FAIL: dist/renderer/index.html missing"; exit 1; }
          test -f dist-electron/main/index.js    || { echo "FAIL: dist-electron/main/index.js missing"; exit 1; }
          test -f dist-electron/preload/index.js || { echo "FAIL: dist-electron/preload/index.js missing"; exit 1; }
          echo "✓ renderer + main + preload present"

      # x64 ONLY.  Never add --arm64 here: a single invocation reuses the same
      # public/bin sidecars for both bundles, which is the original bug.
      - name: Package macOS .dmg + .zip (x64 only)
        working-directory: aimaster-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @aimaster/desktop exec electron-builder --mac dmg zip --x64 --publish never

      # The gate that makes cross-building trustworthy.  Walks every Mach-O in
      # the packaged .app — Electron shell, helpers, frameworks AND the
      # Resources/bin sidecars — and fails on anything without an x86_64 slice.
      - name: Verify EVERY binary in the bundle is x86_64
        working-directory: aimaster-desktop/apps/desktop
        run: |
          set -e
          APP=$(find out -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "✗ no .app found under out/"; ls -R out | head -50; exit 1
          fi
          echo "app bundle: $APP"
          echo "=== main executable ==="
          lipo -archs "$APP/Contents/MacOS/"* || true
          echo ""
          node scripts/verify-mac-arch.cjs "$APP" x64

      - name: List build outputs
        working-directory: aimaster-desktop/apps/desktop
        run: ls -lah out/ || true

      - name: Upload Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Louver-Mastering-AI-mac-intel
          path: |
            aimaster-desktop/apps/desktop/out/*.dmg
            aimaster-desktop/apps/desktop/out/*.zip
          if-no-files-found: error
          retention-days: 30

  # ── Downloadable release ────────────────────────────────────────────────────
  # Publishes (or refreshes) a pre-release carrying just the Intel artefacts, so
  # there is a stable public download URL that does not require opening the
  # Actions tab.  Re-running the workflow updates the same release's assets.
  release-intel:
    name: Publish Intel download
    needs: [build-mac-intel]
    # Only publish from the refs that are meant to be downloadable — a push to
    # some other claude/** branch still builds and uploads a run artifact, but
    # must not move the public release.
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/claude/studio-mix-version-search-gnko8i'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Intel artifacts
        uses: actions/download-artifact@v4
        with:
          name: Louver-Mastering-AI-mac-intel
          path: artifacts/mac-intel

      - name: Inspect downloaded artifacts
        run: ls -lah artifacts/mac-intel/

      - name: Resolve release tag
        id: resolve_tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}-intel" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v3.6.0-intel" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish / update Intel pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:                ${{ steps.resolve_tag.outputs.tag }}
          name:                    Louver Mastering AI v3.6.0 — macOS Intel
          body_path:               docs/MACOS-INTEL.md
          draft:                   false
          prerelease:              true
          fail_on_unmatched_files: true
          target_commitish:        ${{ github.sha }}
          files: |
            artifacts/mac-intel/*.dmg
            artifacts/mac-intel/*.zip
