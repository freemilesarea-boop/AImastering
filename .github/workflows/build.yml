name: Build Louver Mastering AI

on:
  push:
    branches:
      - claude/fix-electron-black-screen-uh3ll
      - main
  workflow_dispatch:   # 수동 실행 버튼

jobs:
  # ── macOS (arm64 + x64 DMG) ──────────────────────────────────────────────────
  build-mac:
    runs-on: macos-14   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install Python dependencies + PyInstaller
        working-directory: aimaster-desktop/services/python-audio
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -r requirements.txt
          .venv/bin/pip install -q pyinstaller

      - name: Build Python engine (PyInstaller)
        working-directory: aimaster-desktop/services/python-audio
        run: |
          mkdir -p ../../apps/desktop/public/bin
          .venv/bin/pyinstaller \
            --clean --noconfirm --onefile --name engine \
            --distpath ../../apps/desktop/public/bin \
            --workpath /tmp/pyinstaller-build \
            --specpath /tmp/pyinstaller-spec \
            --hidden-import soundfile \
            --hidden-import numpy \
            --collect-all soundfile \
            --collect-all numpy \
            --exclude-module tkinter \
            --exclude-module pytest \
            --exclude-module matplotlib \
            app/main.py
          chmod +x ../../apps/desktop/public/bin/engine

      - name: Install Node dependencies
        working-directory: aimaster-desktop
        run: pnpm install --no-frozen-lockfile

      - name: Copy FFmpeg binaries
        working-directory: aimaster-desktop/apps/desktop
        run: node scripts/prebuild.cjs

      - name: Build Electron app
        working-directory: aimaster-desktop/apps/desktop
        run: pnpm build

      - name: Package DMG (arm64 + x64)
        working-directory: aimaster-desktop/apps/desktop
        run: pnpm exec electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # 서명 없이 빌드

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Louver-Mastering-AI-mac
          path: |
            aimaster-desktop/apps/desktop/out/*.dmg
          retention-days: 30

  # ── Windows (NSIS .exe) ───────────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      # Enable Windows long path support BEFORE checkout so git + later steps
      # can handle paths > 260 chars.  Some packaging tools (notably NSIS via
      # electron-builder) cannot read paths above MAX_PATH; combining this with
      # node-linker=hoisted (set below) gives us belt-and-suspenders coverage.
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
          git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install Python dependencies + PyInstaller
        working-directory: aimaster-desktop/services/python-audio
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt
          .venv\Scripts\pip install pyinstaller

      - name: Build Python engine (PyInstaller)
        working-directory: aimaster-desktop/services/python-audio
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "..\..\apps\desktop\public\bin" | Out-Null
          # workpath/specpath must be on same drive as source (D:\ in GitHub Actions)
          $tmpBuild = Join-Path $env:RUNNER_TEMP "pyinstaller-build"
          $tmpSpec  = Join-Path $env:RUNNER_TEMP "pyinstaller-spec"
          .venv\Scripts\pyinstaller `
            --clean --noconfirm --onefile --name engine `
            "--distpath=..\..\apps\desktop\public\bin" `
            "--workpath=$tmpBuild" `
            "--specpath=$tmpSpec" `
            --hidden-import soundfile `
            --hidden-import numpy `
            --collect-all soundfile `
            --collect-all numpy `
            --exclude-module tkinter `
            --exclude-module pytest `
            --exclude-module matplotlib `
            app\main.py

      - name: Install Node dependencies (short virtual store for Windows MAX_PATH)
        working-directory: aimaster-desktop
        shell: pwsh
        # pnpm's default node_modules/.pnpm/<peers-hash>/node_modules/<pkg>/
        # produces paths > 260 chars on Windows when peer-deps are deep
        # (electron-builder's NSIS step blows up on
        # allowOnlyOneInstallerInstance.nsh).  We relocate the entire virtual
        # store to a short C:\ path via --virtual-store-dir, which IS a real
        # pnpm CLI flag.  Result paths become ~210 chars, well under MAX_PATH.
        # Env vars for node-linker/shamefully-hoist are also set as a fallback,
        # though previous runs show pnpm 9 on Windows runner doesn't always
        # honor them — that's why --virtual-store-dir is the primary fix.
        env:
          npm_config_node_linker:                  hoisted
          npm_config_shamefully_hoist:             "true"
          npm_config_virtual_store_dir_max_length: "60"
        run: |
          Write-Host "── pre-install env ──"
          Write-Host "node_linker = $env:npm_config_node_linker"
          Write-Host "shamefully_hoist = $env:npm_config_shamefully_hoist"
          Write-Host "virtual_store_dir_max_length = $env:npm_config_virtual_store_dir_max_length"

          # Primary fix: virtual store on a short path.
          # If hoisted layout works, the store is empty and this dir won't matter.
          # If hoisted is not applied (as observed), the long peers-hash dir
          # lives at C:\v\<hash> instead of $WORKSPACE\...\.pnpm\<hash>, which
          # alone keeps the total path under 260 chars.
          pnpm install --no-frozen-lockfile --virtual-store-dir=C:\v

          Write-Host "── pnpm config (post-install) ──"
          pnpm config get node-linker
          pnpm config get virtual-store-dir-max-length

          Write-Host "── app-builder-lib resolved location ──"
          $resolved = node -e "console.log(require.resolve('app-builder-lib/package.json'))"
          Write-Host "$resolved"
          Write-Host "── path length: $($resolved.Length) chars (must be < 260) ──"

          Write-Host "── virtual store at C:\v ──"
          if (Test-Path "C:\v") {
            Write-Host "exists; first 3 entries:"
            Get-ChildItem C:\v -Force | Select-Object -First 3 Name
          } else {
            Write-Host "C:\v does not exist (good if node-linker=hoisted took effect)"
          }

          Write-Host "── nsis include header reachable? ──"
          $rootMod = Resolve-Path "node_modules"
          $nsh = Join-Path $rootMod "app-builder-lib\templates\nsis\include\allowOnlyOneInstallerInstance.nsh"
          if (Test-Path $nsh) {
            Write-Host "OK: $nsh"
          } else {
            Write-Host "MISSING at top-level (will be reached via .pnpm symlink)"
          }

      - name: Copy FFmpeg binaries
        working-directory: aimaster-desktop/apps/desktop
        run: node scripts/prebuild.cjs

      - name: Build Electron app
        working-directory: aimaster-desktop/apps/desktop
        run: pnpm build

      - name: Package NSIS installer
        working-directory: aimaster-desktop/apps/desktop
        run: pnpm exec electron-builder --win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Louver-Mastering-AI-windows
          path: |
            aimaster-desktop/apps/desktop/out/*.exe
          retention-days: 30
