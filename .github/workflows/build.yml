name: Build Louver Mastering AI (Intel x64 — v3.6.0 deployed base)

# =============================================================================
# INTEL-ONLY BUILD — separate artifact from the LAST DEPLOYED version (v3.6.0)
# -----------------------------------------------------------------------------
# This workflow lives ONLY on the throwaway branch
# `claude/intel-x64-v3.6.0-deployed`.  Its purpose is to produce a *working*
# Intel (x86_64) macOS build whose feature/code state is IDENTICAL to the last
# deployed release, v3.6.0 (commit ce82263).  It intentionally does NOT touch
# the in-development update branch and adds NO new features — the ONLY thing
# added on top of v3.6.0's app code is the per-arch packaging fix + arch gate
# (pure build/CI infrastructure), which is required to make the three bundled
# binaries (engine / ffmpeg / ffprobe) come out x86_64 instead of arm64.
#
# ROOT CAUSE this fixes: v3.6.0 was packaged on a single Apple-Silicon runner,
# so electron-builder wrapped an x86_64 Electron shell around arm64
# engine/ffmpeg/ffprobe (extraResources are copied verbatim, never
# arch-transformed) -> "bad CPU type in executable" on Intel Macs.  The fix is
# to build the x64 package on an Intel runner so PyInstaller / ffmpeg-static /
# @ffprobe-installer all resolve to native x86_64.
#
# Intel-only: linux / windows / arm64 / release-draft jobs are deliberately
# omitted — the goal is a single Intel-only artifact, nothing else.
# =============================================================================

on:
  push:
    branches:
      - 'claude/intel-x64-v3.6.0-deployed'
  workflow_dispatch:

jobs:
  # ── macOS Intel (x64) — dmg + zip, built natively on an x86_64 runner ────────
  build-mac-intel:
    runs-on: macos-15-intel   # Intel (x86_64) — macos-13 retired 2025-12-04.
                              # macos-15-intel is GitHub's official x86_64
                              # migration label (standard runner, free for
                              # public repos, supported until ~Fall 2027).
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Report runner architecture
        run: |
          echo "target arch = x64 (x86_64)"
          echo "uname -m    = $(uname -m)"
          echo "python arch = $(python3 -c 'import platform; print(platform.machine())')"
          if [[ "$(uname -m)" != "x86_64" ]]; then
            echo "FAIL: runner is not x86_64 — refusing to build a mislabelled Intel artifact." >&2
            exit 1
          fi

      - name: Install Python dependencies + PyInstaller
        working-directory: aimaster-desktop/services/python-audio
        run: |
          set -e
          python3 -V
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          # Pin PyInstaller to 6.11.x — last release tested against the
          # numpy<2 / soundfile 0.13 combination this engine ships with.
          .venv/bin/pip install "pyinstaller==6.11.1"
          .venv/bin/pip list

      # PyInstaller emits a HOST-arch binary (it cannot cross-compile).  On the
      # Intel runner above, that host arch IS x86_64 — the target arch.
      - name: Build Python engine (PyInstaller — native x86_64)
        working-directory: aimaster-desktop/services/python-audio
        run: |
          set -e
          mkdir -p ../../apps/desktop/public/bin
          .venv/bin/pyinstaller \
            --clean --noconfirm --onefile --name engine \
            --log-level INFO \
            --distpath ../../apps/desktop/public/bin \
            --workpath /tmp/pyinstaller-build \
            --specpath /tmp/pyinstaller-spec \
            --hidden-import soundfile \
            --hidden-import numpy \
            --collect-all soundfile \
            --collect-all numpy \
            --exclude-module tkinter \
            --exclude-module pytest \
            --exclude-module matplotlib \
            app/main.py
          chmod +x ../../apps/desktop/public/bin/engine
          ls -la ../../apps/desktop/public/bin/

      - name: Install Node dependencies (clean)
        working-directory: aimaster-desktop
        run: |
          rm -rf node_modules apps/desktop/node_modules packages/*/node_modules
          pnpm store prune || true
          pnpm install --no-frozen-lockfile

      # Filesystem-only diagnostic — never launches the electron binary.
      - name: Verify electron is installed (filesystem check)
        continue-on-error: true
        working-directory: aimaster-desktop
        run: |
          echo "=== electron module locations ==="
          find . -maxdepth 6 -type d -name "electron" ! -path "*/node_modules/*/node_modules/*" 2>/dev/null | head -10 || true
          cat node_modules/electron/package.json 2>/dev/null | grep -E '"version"' | head -1 || echo "(not at root)"
          cat apps/desktop/node_modules/electron/package.json 2>/dev/null | grep -E '"version"' | head -1 || echo "(not at apps/desktop)"

      # ffmpeg-static / @ffprobe-installer resolve to the HOST arch, which on
      # the Intel runner IS x86_64.
      - name: Copy FFmpeg binaries
        working-directory: aimaster-desktop/apps/desktop
        run: node scripts/prebuild.cjs

      # ── ARCH GATE (pre-package) ──────────────────────────────────────────────
      # Fail fast if engine/ffmpeg/ffprobe are not x86_64 BEFORE packaging.
      - name: Verify bundled binaries are x64 (pre-package gate)
        run: bash scripts/verify-macos-binary-arch.sh x64 aimaster-desktop/apps/desktop/public/bin

      - name: Clean previous out/ + dist*/ before build
        working-directory: aimaster-desktop/apps/desktop
        run: rm -rf out dist dist-electron

      # AUTO_UPDATE_ENABLED=false — this is an inspection/side artifact, never a
      # published auto-update feed.  Nothing here writes to a release channel.
      - name: Build Electron app
        working-directory: aimaster-desktop/apps/desktop
        env:
          AUTO_UPDATE_ENABLED: 'false'
        run: pnpm build

      - name: Verify build outputs (renderer + main + preload)
        working-directory: aimaster-desktop/apps/desktop
        run: |
          set -e
          test -f dist/renderer/index.html || (echo "FAIL: missing renderer"; exit 1)
          test -f dist-electron/main/index.js || (echo "FAIL: missing main"; exit 1)
          test -f dist-electron/preload/index.js || (echo "FAIL: missing preload"; exit 1)
          echo "OK — renderer + main + preload present"

      # Package x64 ONLY.  The `--x64` flag selects exactly the x64 entry from
      # electron-builder.yml's mac target list, so no arm64 output is emitted.
      # --publish never: never touches any release channel.
      - name: Package macOS .dmg + .zip (x64)
        id: pack_mac
        working-directory: aimaster-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        continue-on-error: true
        run: pnpm --filter @aimaster/desktop exec electron-builder --mac dmg zip --x64 --publish never

      # If hdiutil DMG packaging flakes, fall back to zip-only (still a valid,
      # correctly-architected x64 artifact).
      - name: Fallback — package macOS .zip only (x64)
        if: steps.pack_mac.outcome == 'failure'
        working-directory: aimaster-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @aimaster/desktop exec electron-builder --mac zip --x64 --publish never

      - name: List build outputs
        working-directory: aimaster-desktop/apps/desktop
        run: ls -lah out/ || true

      # ── ARCH GATE (post-package) ─────────────────────────────────────────────
      # The exact steps 5-8 from the task: inspect the shipped .app's internal
      # binaries (Resources/bin/{engine,ffmpeg,ffprobe}) AND the main Electron
      # executable (MacOS/) — ALL must be x86_64 or the build is blocked.
      - name: Verify PACKAGED .app binaries are x64 (post-package gate — steps 5-8)
        working-directory: aimaster-desktop/apps/desktop
        run: |
          set -e
          APP="$(find out -maxdepth 2 -name '*.app' -type d | head -1)"
          if [[ -z "$APP" ]]; then echo "FAIL: no .app found under out/"; exit 1; fi
          echo "Inspecting packaged app: $APP"
          echo ""
          echo "=== raw file output (task step 7) ==="
          file "$APP/Contents/MacOS/"* || true
          file "$APP/Contents/Resources/bin/ffmpeg" || true
          file "$APP/Contents/Resources/bin/ffprobe" || true
          file "$APP/Contents/Resources/bin/engine" || true
          echo ""
          bash "$GITHUB_WORKSPACE/scripts/verify-macos-binary-arch.sh" x64 \
            "$APP/Contents/Resources/bin" \
            "$APP/Contents/MacOS/Louver Mastering AI"

      - name: Upload Intel artifact (x64)
        uses: actions/upload-artifact@v4
        with:
          name: Louver-Mastering-AI-mac-x64-v3.6.0
          path: |
            aimaster-desktop/apps/desktop/out/*.dmg
            aimaster-desktop/apps/desktop/out/*.zip
            aimaster-desktop/apps/desktop/out/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

      # ── RUNTIME EXECUTION + WAV MASTERING TEST (task steps 9-10) ─────────────
      # Proves the x86_64 binaries not only have the right CPU type on disk but
      # actually EXECUTE and produce a mastered file on this native Intel host.
      # Runs AFTER upload so the artifact is preserved even if this fails.
      - name: Runtime execution + WAV mastering test (native Intel x86_64)
        working-directory: aimaster-desktop/apps/desktop
        run: |
          set -e
          APP="$(find out -maxdepth 2 -name '*.app' -type d | head -1)"
          BIN="$APP/Contents/Resources/bin"
          echo "bin dir: $BIN"

          # 1) the bundled binaries must actually RUN on Intel (not just be x86_64 on disk)
          export AIMASTER_FFMPEG="$BIN/ffmpeg"
          export AIMASTER_FFPROBE="$BIN/ffprobe"
          echo "=== ffmpeg -version ===";  "$BIN/ffmpeg"  -hide_banner -version | head -1
          echo "=== ffprobe -version ==="; "$BIN/ffprobe" -hide_banner -version | head -1

          # 2) synthesize a real WAV (3s stereo sine, 44.1k/16-bit) with the bundled ffmpeg
          TMP="$RUNNER_TEMP/audiotest"; mkdir -p "$TMP"
          IN="$TMP/in.wav"; OUT="$TMP/mastered.wav"
          "$BIN/ffmpeg" -hide_banner -y -f lavfi \
            -i "sine=frequency=440:sample_rate=44100:duration=3" \
            -ac 2 -c:a pcm_s16le "$IN"
          echo "=== input WAV ==="; "$BIN/ffprobe" -hide_banner "$IN" 2>&1 | grep -E 'Duration|Audio' || true
          ls -la "$IN"

          # 3) drive the engine over JSON-RPC: analyze the input, then master it
          REQ_A='{"id":"a1","method":"analyze","params":{"file_path":"'"$IN"'"}}'
          REQ_M='{"id":"m1","method":"master","params":{"input_path":"'"$IN"'","output_path":"'"$OUT"'","style":"balanced","target_lufs":-14.0,"target_tp":-1.0,"generate_waveforms":false}}'
          printf '%s\n%s\n' "$REQ_A" "$REQ_M" | "$BIN/engine" > "$TMP/engine.out" 2> "$TMP/engine.err" || true

          echo "=== engine stderr (tail 40) ==="; tail -40 "$TMP/engine.err" || true
          echo "=== engine stdout (responses) ==="; cat "$TMP/engine.out" || true
          echo ""

          # 4) assertions — analysis responded, mastering responded, output produced
          grep -Eq '"id": *"a1"' "$TMP/engine.out" || (echo "FAIL: no analyze response"; exit 1)
          grep -Eq '"id": *"m1"' "$TMP/engine.out" || (echo "FAIL: no master response"; exit 1)
          test -f "$OUT" || (echo "FAIL: mastered output file was not created"; exit 1)
          SIZE=$(stat -f%z "$OUT" 2>/dev/null || stat -c%s "$OUT")
          echo "mastered output = $OUT ($SIZE bytes)"
          test "$SIZE" -gt 20000 || (echo "FAIL: mastered file implausibly small ($SIZE bytes)"; exit 1)

          # 5) the exported file must be a valid, decodable audio file
          echo "=== ffprobe of mastered output ==="
          "$BIN/ffprobe" -hide_banner "$OUT" 2>&1 | grep -E 'Duration|Audio|Stream' || true
          "$BIN/ffprobe" -v error -show_entries stream=codec_type -of csv=p=0 "$OUT" | grep -q audio \
            || (echo "FAIL: exported file has no decodable audio stream"; exit 1)

          echo ""
          echo "RUNTIME PASS — bundled x86_64 binaries executed; WAV analyze -> master -> export all succeeded on native Intel."
