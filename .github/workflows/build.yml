name: Build Louver Mastering AI

on:
  push:
    branches:
      - claude/fix-electron-black-screen-uh3ll
      - main
  workflow_dispatch:   # 수동 실행 버튼

jobs:
  # ── macOS (arm64 + x64 DMG) ──────────────────────────────────────────────────
  build-mac:
    runs-on: macos-14   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install Python dependencies + PyInstaller
        working-directory: aimaster-desktop/services/python-audio
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -r requirements.txt
          .venv/bin/pip install -q pyinstaller

      - name: Build Python engine (PyInstaller)
        working-directory: aimaster-desktop/services/python-audio
        run: |
          mkdir -p ../../apps/desktop/public/bin
          .venv/bin/pyinstaller \
            --clean --noconfirm --onefile --name engine \
            --distpath ../../apps/desktop/public/bin \
            --workpath /tmp/pyinstaller-build \
            --specpath /tmp/pyinstaller-spec \
            --hidden-import soundfile \
            --hidden-import numpy \
            --collect-all soundfile \
            --collect-all numpy \
            --exclude-module tkinter \
            --exclude-module pytest \
            --exclude-module matplotlib \
            app/main.py
          chmod +x ../../apps/desktop/public/bin/engine

      - name: Install Node dependencies
        working-directory: aimaster-desktop
        run: pnpm install --no-frozen-lockfile

      - name: Copy FFmpeg binaries
        working-directory: aimaster-desktop/apps/desktop
        run: node scripts/prebuild.cjs

      - name: Build Electron app
        working-directory: aimaster-desktop/apps/desktop
        run: pnpm build

      - name: Package DMG (arm64 + x64)
        working-directory: aimaster-desktop/apps/desktop
        run: pnpm exec electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # 서명 없이 빌드

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Louver-Mastering-AI-mac
          path: |
            aimaster-desktop/apps/desktop/out/*.dmg
          retention-days: 30

  # ── Windows (NSIS .exe) ───────────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    # All build steps run inside the short-path workspace `D:\w` so that the
    # full path of any file created during build (notably the deeply-nested
    # node_modules\.pnpm\<peers-hash>\node_modules\<pkg>\templates\nsis\...
    # NSH headers electron-builder reads) stays under Windows' 260-char
    # MAX_PATH.  GitHub's default $GITHUB_WORKSPACE on Windows runners is
    # D:\a\<repo>\<repo>\ (~25 chars) which alone consumes too much budget;
    # D:\w\ (3 chars) saves enough margin for the build to succeed even with
    # default pnpm peers-hash truncation at 120 chars.
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
          git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: Mount workspace at short path D:\w (junction)
        shell: pwsh
        run: |
          # Junction (mklink /J) is transparent at the filesystem level and
          # does not require admin privileges.  Paths entered through D:\w
          # stay on the D:\w prefix in subsequent path operations (Node
          # require.resolve preserves the junction prefix).
          if (Test-Path D:\w) {
            cmd /c rmdir D:\w 2>$null
            if (Test-Path D:\w) { Remove-Item D:\w -Recurse -Force }
          }
          cmd /c mklink /J D:\w "$env:GITHUB_WORKSPACE"
          Write-Host "── junction created ──"
          Write-Host "D:\w → $env:GITHUB_WORKSPACE"
          # Sanity: verify we can read a known file via D:\w
          if (Test-Path "D:\w\aimaster-desktop\package.json") {
            Write-Host "junction works: D:\w\aimaster-desktop\package.json visible"
          } else {
            Write-Error "junction created but workspace files not visible at D:\w"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install Python dependencies + PyInstaller
        run: |
          cd D:\w\aimaster-desktop\services\python-audio
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt
          .venv\Scripts\pip install pyinstaller

      - name: Build Python engine (PyInstaller)
        run: |
          cd D:\w\aimaster-desktop\services\python-audio
          New-Item -ItemType Directory -Force -Path "..\..\apps\desktop\public\bin" | Out-Null
          # workpath/specpath must be on same drive (D:\)
          $tmpBuild = Join-Path $env:RUNNER_TEMP "pyinstaller-build"
          $tmpSpec  = Join-Path $env:RUNNER_TEMP "pyinstaller-spec"
          .venv\Scripts\pyinstaller `
            --clean --noconfirm --onefile --name engine `
            "--distpath=..\..\apps\desktop\public\bin" `
            "--workpath=$tmpBuild" `
            "--specpath=$tmpSpec" `
            --hidden-import soundfile `
            --hidden-import numpy `
            --collect-all soundfile `
            --collect-all numpy `
            --exclude-module tkinter `
            --exclude-module pytest `
            --exclude-module matplotlib `
            app\main.py

      - name: Install Node dependencies (run from D:\w short-path workspace)
        env:
          npm_config_node_linker:                  hoisted
          npm_config_shamefully_hoist:             "true"
          npm_config_virtual_store_dir_max_length: "60"
        run: |
          cd D:\w\aimaster-desktop
          # Wipe any stale install
          if (Test-Path "node_modules") { Remove-Item -Recurse -Force "node_modules" }
          pnpm install --no-frozen-lockfile

          Write-Host "── post-install diagnostics ──"
          $resolved = node -e "console.log(require.resolve('app-builder-lib/package.json'))"
          Write-Host "app-builder-lib resolved at: $resolved"
          Write-Host "path length: $($resolved.Length) chars"
          if ($resolved.Length -ge 260) {
            Write-Error "RESOLVED PATH STILL > 260 chars — NSIS will fail"
            exit 1
          }
          Write-Host "── ok, NSIS will be able to read this ──"

      - name: Copy FFmpeg binaries
        run: |
          cd D:\w\aimaster-desktop\apps\desktop
          node scripts/prebuild.cjs

      - name: Build Electron app
        run: |
          cd D:\w\aimaster-desktop\apps\desktop
          pnpm build

      - name: Package NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd D:\w\aimaster-desktop\apps\desktop
          pnpm exec electron-builder --win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Louver-Mastering-AI-windows
          # Junction is transparent — files written under D:\w\... are also
          # visible under $GITHUB_WORKSPACE\... so the relative path works.
          path: |
            aimaster-desktop/apps/desktop/out/*.exe
          retention-days: 30
