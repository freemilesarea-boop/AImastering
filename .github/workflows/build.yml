name: Build Louver Mastering AI

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'           # v3.5.0, v3.5.1 등 — release 빌드 트리거
  workflow_dispatch:
    inputs:
      release_tag:
        description: |
          GitHub Release 를 만들 tag 이름 (예: v3.5.0).
          비워두면 release-draft job 은 실행되지 않고 build artifact 만 남음.
          softprops/action-gh-release 가 tag 가 없으면 자동 생성.
        required: false
        type: string
        default: ''

jobs:
  # ── Linux (AppImage) ─────────────────────────────────────────────────────────
  # No codesign required.  ffmpeg-static 7.0.2 binary is bundled — verifies
  # the active engine works against the same ffmpeg version that the macOS /
  # Windows runners use, preventing version-skew regressions like the
  # adynamicequalizer mode enum issue (R2).
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install Python dependencies + PyInstaller
        working-directory: aimaster-desktop/services/python-audio
        run: |
          set -e
          python3 -V
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install "pyinstaller==6.11.1"

      - name: Build Python engine (PyInstaller)
        working-directory: aimaster-desktop/services/python-audio
        run: |
          set -e
          mkdir -p ../../apps/desktop/public/bin
          .venv/bin/pyinstaller \
            --clean --noconfirm --onefile --name engine \
            --log-level INFO \
            --distpath ../../apps/desktop/public/bin \
            --workpath /tmp/pyinstaller-build \
            --specpath /tmp/pyinstaller-spec \
            --hidden-import soundfile --hidden-import numpy \
            --collect-all soundfile --collect-all numpy \
            --exclude-module tkinter --exclude-module pytest --exclude-module matplotlib \
            app/main.py
          chmod +x ../../apps/desktop/public/bin/engine
          ls -la ../../apps/desktop/public/bin/

      - name: Install Node dependencies
        working-directory: aimaster-desktop
        run: pnpm install --no-frozen-lockfile

      - name: Copy FFmpeg binaries
        working-directory: aimaster-desktop/apps/desktop
        run: node scripts/prebuild.cjs

      - name: Typecheck (strict + exactOptionalPropertyTypes)
        working-directory: aimaster-desktop
        run: pnpm -s typecheck

      # Guard: CI ships the COMMITTED wasm/node/worklet artifacts (it does not
      # rebuild them).  This fails loudly if a Rust binding setter was added
      # without rebuilding + committing the artifacts, or if the generated
      # worklet copy drifted from its source.  Rebuild: pnpm --filter
      # @loui/dsp-wasm run build:all.
      - name: Guard — committed WASM artifacts are fresh
        working-directory: aimaster-desktop/apps/desktop
        run: pnpm -s test:wasm-fresh

      # v3.4.5 — bake AUTO_UPDATE_ENABLED into the main bundle.
      # Tag push (refs/tags/v*) → true → installer will check GitHub Releases.
      # Branch / workflow_dispatch artefact → false → updater stays silent.
      - name: Build Electron app (renderer + main)
        working-directory: aimaster-desktop/apps/desktop
        env:
          AUTO_UPDATE_ENABLED: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
        run: pnpm build

      # v3.4.3 — auto-update.  On tag push (refs/tags/v*) electron-builder
      # publishes artefacts + the latest-linux.yml metadata to GitHub Releases
      # so electron-updater clients can discover the new version.
      # On regular branch pushes we just build the artefact for CI sanity.
      - name: Compute publish flag
        id: pub
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "flag=always" >> "$GITHUB_OUTPUT"
          else
            echo "flag=never" >> "$GITHUB_OUTPUT"
          fi

      - name: Package AppImage + deb
        working-directory: aimaster-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @aimaster/desktop exec electron-builder --linux AppImage deb --x64 --publish ${{ steps.pub.outputs.flag }}

      - name: List build outputs
        working-directory: aimaster-desktop/apps/desktop
        run: ls -lah out/

      - name: Upload Linux artifacts (AppImage + deb)
        uses: actions/upload-artifact@v4
        with:
          name: Louver-Mastering-AI-linux
          path: |
            aimaster-desktop/apps/desktop/out/*.AppImage
            aimaster-desktop/apps/desktop/out/*.deb
            aimaster-desktop/apps/desktop/out/latest-linux.yml
          if-no-files-found: error
          retention-days: 30


  # ── macOS (arm64 + x64 zip) ──────────────────────────────────────────────────
  # DMG is intentionally disabled on this branch — the macOS runner has been
  # failing on `hdiutil attach` during DMG packaging.  zip is reliable.
  build-mac:
    runs-on: macos-14   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install Python dependencies + PyInstaller
        working-directory: aimaster-desktop/services/python-audio
        run: |
          set -e
          python3 -V
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          # Pin PyInstaller to 6.11.x — last release tested against the
          # numpy<2 / soundfile 0.13 combination this engine ships with.
          .venv/bin/pip install "pyinstaller==6.11.1"
          .venv/bin/pip list

      - name: Build Python engine (PyInstaller)
        working-directory: aimaster-desktop/services/python-audio
        run: |
          set -e
          mkdir -p ../../apps/desktop/public/bin
          .venv/bin/pyinstaller \
            --clean --noconfirm --onefile --name engine \
            --log-level INFO \
            --distpath ../../apps/desktop/public/bin \
            --workpath /tmp/pyinstaller-build \
            --specpath /tmp/pyinstaller-spec \
            --hidden-import soundfile \
            --hidden-import numpy \
            --collect-all soundfile \
            --collect-all numpy \
            --exclude-module tkinter \
            --exclude-module pytest \
            --exclude-module matplotlib \
            app/main.py
          chmod +x ../../apps/desktop/public/bin/engine
          ls -la ../../apps/desktop/public/bin/

      - name: Install Node dependencies (clean)
        working-directory: aimaster-desktop
        run: |
          rm -rf node_modules apps/desktop/node_modules packages/*/node_modules
          pnpm store prune || true
          pnpm install --no-frozen-lockfile

      # Filesystem-only diagnostic — never launches the electron binary
      # (which would fail on CI runners due to GUI / quarantine / sandbox).
      # continue-on-error so this never blocks the build.
      - name: Verify electron is installed (filesystem check)
        continue-on-error: true
        working-directory: aimaster-desktop
        run: |
          echo "=== pnpm list electron (apps/desktop) ==="
          pnpm --filter @aimaster/desktop list electron || true
          echo ""
          echo "=== electron module exists where? ==="
          find . -maxdepth 6 -type d -name "electron" ! -path "*/node_modules/*/node_modules/*" 2>/dev/null | head -10 || true
          echo ""
          echo "=== electron package.json version (root node_modules) ==="
          cat node_modules/electron/package.json 2>/dev/null | grep -E '"version"' | head -1 || echo "(not at root)"
          echo "=== electron package.json version (apps/desktop/node_modules) ==="
          cat apps/desktop/node_modules/electron/package.json 2>/dev/null | grep -E '"version"' | head -1 || echo "(not at apps/desktop)"
          echo ""
          echo "=== electron-builder binary ==="
          ls -la node_modules/.bin/electron-builder 2>/dev/null || ls -la apps/desktop/node_modules/.bin/electron-builder 2>/dev/null || true

      - name: Copy FFmpeg binaries
        working-directory: aimaster-desktop/apps/desktop
        run: node scripts/prebuild.cjs

      # ── Clean stale outputs BEFORE build (must NOT run after build —
      # doing so wipes the freshly-built dist-electron/main JS that
      # electron-builder needs to package into app.asar).  v3.4.2 split
      # renderer (dist/) and main (dist-electron/) into separate dirs so
      # accidents like that cause an obvious build failure instead of
      # silently destroying main.
      - name: Clean previous out/ + dist*/ before build
        working-directory: aimaster-desktop/apps/desktop
        run: |
          rm -rf out dist dist-electron

      # v3.4.5 — see Linux job comment.
      - name: Build Electron app
        working-directory: aimaster-desktop/apps/desktop
        env:
          AUTO_UPDATE_ENABLED: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
        run: pnpm build

      # ── Sanity: verify the artefacts electron-builder will package exist ──
      - name: Verify build outputs (renderer + main + preload)
        working-directory: aimaster-desktop/apps/desktop
        run: |
          set -e
          echo "=== dist/renderer/index.html (from vite) ==="
          test -f dist/renderer/index.html || (echo "FAIL: missing"; exit 1)
          ls -la dist/renderer/ | head -10
          echo ""
          echo "=== dist-electron/main/index.js (from esbuild) ==="
          test -f dist-electron/main/index.js || (echo "FAIL: missing"; exit 1)
          ls -la dist-electron/main/
          echo ""
          echo "=== dist-electron/preload/index.js (from esbuild) ==="
          test -f dist-electron/preload/index.js || (echo "FAIL: missing"; exit 1)
          ls -la dist-electron/preload/

      # ── Diagnostic dump — prove which config drives the next step ──────────
      - name: Diagnose electron-builder config (pre-package)
        continue-on-error: true
        run: |
          echo "=== root package.json ==="
          cat package.json || true
          echo ""
          echo "=== aimaster-desktop/package.json ==="
          cat aimaster-desktop/package.json || true
          echo ""
          echo "=== aimaster-desktop/apps/desktop/package.json ==="
          cat aimaster-desktop/apps/desktop/package.json || true
          echo ""
          echo "=== electron-builder.yml ==="
          cat aimaster-desktop/apps/desktop/electron-builder.yml || true
          echo ""
          echo "=== all electron-builder config files (non-vendored) ==="
          find . -maxdepth 6 -type f \( -iname "electron-builder*" -o -iname "builder*.yml" -o -iname "builder*.yaml" -o -iname "builder*.json" \) \
            ! -path "*/node_modules/*" ! -path "*/.git/*" 2>/dev/null || true

      # v3.4.3 — auto-update.  Build dmg + zip both: dmg is the user-friendly
      # first-install format, zip is what electron-updater consumes for
      # delta updates.  Tag push uploads the metadata YAML alongside.
      #
      # !! Auto-update on macOS still requires code-signing + notarization.
      # Without them the OS Gatekeeper blocks the replacement process.
      # See electron-builder.yml `mac.identity` TODO for v3.5.
      - name: Compute publish flag
        id: pub
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "flag=always" >> "$GITHUB_OUTPUT"
          else
            echo "flag=never" >> "$GITHUB_OUTPUT"
          fi

      - name: Package macOS .dmg + .zip (arm64 + x64)
        id: pack_mac
        working-directory: aimaster-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: pnpm --filter @aimaster/desktop exec electron-builder --mac dmg zip --x64 --arm64 --publish ${{ steps.pub.outputs.flag }}

      - name: Fallback — package macOS .zip (split per-arch, no dmg)
        if: steps.pack_mac.outcome == 'failure'
        working-directory: aimaster-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm --filter @aimaster/desktop exec electron-builder --mac zip --arm64 --publish ${{ steps.pub.outputs.flag }}
          pnpm --filter @aimaster/desktop exec electron-builder --mac zip --x64   --publish ${{ steps.pub.outputs.flag }}

      - name: List build outputs
        working-directory: aimaster-desktop/apps/desktop
        run: |
          ls -lah out/ || true

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Louver-Mastering-AI-mac
          path: |
            aimaster-desktop/apps/desktop/out/*.dmg
            aimaster-desktop/apps/desktop/out/*.zip
            aimaster-desktop/apps/desktop/out/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

  # ── Windows (NSIS installer) ─────────────────────────────────────────────────
  # NSIS is intentionally disabled on this branch — see electron-builder.yml.
  build-win:
    runs-on: windows-latest
    # All build steps run inside the short-path workspace `D:\w` so that the
    # full path of any file created during build (notably the deeply-nested
    # node_modules\.pnpm\<peers-hash>\node_modules\<pkg>\templates\nsis\...
    # NSH headers electron-builder reads) stays under Windows' 260-char
    # MAX_PATH.  GitHub's default $GITHUB_WORKSPACE on Windows runners is
    # D:\a\<repo>\<repo>\ (~25 chars) which alone consumes too much budget;
    # D:\w\ (3 chars) saves enough margin for the build to succeed even with
    # default pnpm peers-hash truncation at 120 chars.
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
          git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: Mount workspace at short path D:\w (junction)
        shell: pwsh
        run: |
          # Junction (mklink /J) is transparent at the filesystem level and
          # does not require admin privileges.  Paths entered through D:\w
          # stay on the D:\w prefix in subsequent path operations (Node
          # require.resolve preserves the junction prefix).
          if (Test-Path D:\w) {
            cmd /c rmdir D:\w 2>$null
            if (Test-Path D:\w) { Remove-Item D:\w -Recurse -Force }
          }
          cmd /c mklink /J D:\w "$env:GITHUB_WORKSPACE"
          Write-Host "── junction created ──"
          Write-Host "D:\w → $env:GITHUB_WORKSPACE"
          # Sanity: verify we can read a known file via D:\w
          if (Test-Path "D:\w\aimaster-desktop\package.json") {
            Write-Host "junction works: D:\w\aimaster-desktop\package.json visible"
          } else {
            Write-Error "junction created but workspace files not visible at D:\w"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install Python dependencies + PyInstaller
        run: |
          cd D:\w\aimaster-desktop\services\python-audio
          python --version
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt
          # Pin PyInstaller to 6.11.x — last release tested against the
          # numpy<2 / soundfile 0.13 combination this engine ships with.
          .venv\Scripts\pip install "pyinstaller==6.11.1"
          .venv\Scripts\pip list

      - name: Build Python engine (PyInstaller)
        run: |
          cd D:\w\aimaster-desktop\services\python-audio
          New-Item -ItemType Directory -Force -Path "..\..\apps\desktop\public\bin" | Out-Null
          # workpath/specpath must be on same drive (D:\)
          $tmpBuild = Join-Path $env:RUNNER_TEMP "pyinstaller-build"
          $tmpSpec  = Join-Path $env:RUNNER_TEMP "pyinstaller-spec"
          .venv\Scripts\pyinstaller `
            --clean --noconfirm --onefile --name engine `
            --log-level INFO `
            "--distpath=..\..\apps\desktop\public\bin" `
            "--workpath=$tmpBuild" `
            "--specpath=$tmpSpec" `
            --hidden-import soundfile `
            --hidden-import numpy `
            --collect-all soundfile `
            --collect-all numpy `
            --exclude-module tkinter `
            --exclude-module pytest `
            --exclude-module matplotlib `
            app\main.py
          Get-ChildItem ..\..\apps\desktop\public\bin\

      - name: Clean pnpm store + node_modules (no stale electron-builder peers)
        run: |
          cd D:\w\aimaster-desktop
          # Clear any cached pnpm content store from previous runs.  GitHub
          # Actions Windows runners are ephemeral but pnpm caches in
          # ~\.local\share\pnpm so be explicit.
          pnpm store prune 2>$null
          if (Test-Path "node_modules") {
            Write-Host "removing stale node_modules"
            Remove-Item -Recurse -Force "node_modules"
          }
          if (Test-Path "apps\desktop\node_modules") {
            Remove-Item -Recurse -Force "apps\desktop\node_modules"
          }
          if (Test-Path "packages\audio-engine\node_modules") {
            Remove-Item -Recurse -Force "packages\audio-engine\node_modules"
          }

      - name: Install Node dependencies (run from D:\w short-path workspace)
        env:
          npm_config_node_linker:                  hoisted
          npm_config_shamefully_hoist:             "true"
          npm_config_virtual_store_dir_max_length: "60"
        run: |
          cd D:\w\aimaster-desktop
          pnpm install --no-frozen-lockfile

      # Filesystem-only diagnostic — never launches the electron.exe binary
      # (avoids any GUI / signing / sandbox failure modes on CI).
      # continue-on-error so this never blocks the build.
      - name: Verify electron is installed (filesystem check)
        continue-on-error: true
        run: |
          cd D:\w\aimaster-desktop
          Write-Host "=== pnpm list electron (apps/desktop) ==="
          try { pnpm --filter @aimaster/desktop list electron } catch { Write-Host "list failed: $_" }
          Write-Host ""
          Write-Host "=== electron module locations ==="
          Get-ChildItem -Recurse -Directory -Filter "electron" -Depth 4 -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\node_modules\\electron[\\/]node_modules\\' } |
            Select-Object -First 10 FullName
          Write-Host ""
          Write-Host "=== electron package.json version ==="
          $top  = "node_modules\electron\package.json"
          $ad   = "apps\desktop\node_modules\electron\package.json"
          if (Test-Path $top) { (Get-Content $top -Raw | ConvertFrom-Json).version | ForEach-Object { Write-Host "root node_modules\electron : $_" } }
          if (Test-Path $ad)  { (Get-Content $ad  -Raw | ConvertFrom-Json).version | ForEach-Object { Write-Host "apps\desktop\node_modules\electron : $_" } }
          Write-Host ""
          Write-Host "=== electron-builder binary ==="
          if (Test-Path "node_modules\.bin\electron-builder.cmd") { Write-Host "exists at root node_modules\.bin" }
          if (Test-Path "apps\desktop\node_modules\.bin\electron-builder.cmd") { Write-Host "exists at apps\desktop\node_modules\.bin" }

      - name: Copy FFmpeg binaries
        run: |
          cd D:\w\aimaster-desktop\apps\desktop
          node scripts/prebuild.cjs

      # ── Clean stale outputs BEFORE build (must NOT run after build —
      # doing so wipes the freshly-built main JS that electron-builder needs).
      - name: Clean previous out/ + dist*/ before build
        run: |
          cd D:\w\aimaster-desktop\apps\desktop
          if (Test-Path "out")           { Remove-Item -Recurse -Force "out" }
          if (Test-Path "dist")          { Remove-Item -Recurse -Force "dist" }
          if (Test-Path "dist-electron") { Remove-Item -Recurse -Force "dist-electron" }

      # v3.4.5 — see Linux job comment.
      - name: Build Electron app
        env:
          AUTO_UPDATE_ENABLED: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
        run: |
          cd D:\w\aimaster-desktop\apps\desktop
          pnpm build

      # ── Sanity: verify the artefacts electron-builder will package exist ──
      - name: Verify build outputs (renderer + main + preload)
        run: |
          cd D:\w\aimaster-desktop\apps\desktop
          if (-not (Test-Path "dist\renderer\index.html"))     { Write-Error "missing dist/renderer/index.html"; exit 1 }
          if (-not (Test-Path "dist-electron\main\index.js"))  { Write-Error "missing dist-electron/main/index.js"; exit 1 }
          if (-not (Test-Path "dist-electron\preload\index.js")) { Write-Error "missing dist-electron/preload/index.js"; exit 1 }
          Write-Host "── all build outputs present ──"
          Get-ChildItem -Recurse -File dist, dist-electron | Select-Object FullName, Length | Format-Table -AutoSize

      # ── Diagnostic dump — prove which config drives the next step ──────────
      - name: Diagnose electron-builder config (pre-package)
        continue-on-error: true
        run: |
          cd D:\w
          Write-Host "=== root package.json ==="
          if (Test-Path package.json) { Get-Content package.json }
          Write-Host ""
          Write-Host "=== aimaster-desktop\package.json ==="
          if (Test-Path aimaster-desktop\package.json) { Get-Content aimaster-desktop\package.json }
          Write-Host ""
          Write-Host "=== aimaster-desktop\apps\desktop\package.json ==="
          if (Test-Path aimaster-desktop\apps\desktop\package.json) { Get-Content aimaster-desktop\apps\desktop\package.json }
          Write-Host ""
          Write-Host "=== aimaster-desktop\apps\desktop\electron-builder.yml ==="
          if (Test-Path aimaster-desktop\apps\desktop\electron-builder.yml) { Get-Content aimaster-desktop\apps\desktop\electron-builder.yml }
          Write-Host ""
          Write-Host "=== all electron-builder config files (non-vendored) ==="
          Get-ChildItem -Recurse -File -Include "electron-builder*","builder*.yml","builder*.yaml","builder*.json" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\node_modules\\' -and $_.FullName -notmatch '\\.git\\' } |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      # v3.4.4 — NSIS installer only (portable target dropped — see
      # electron-builder.yml comment).  Tag push uploads to GitHub Releases
      # + the latest.yml metadata used by electron-updater clients.
      - name: Compute publish flag
        id: pub
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            "flag=always" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "flag=never" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Package NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd D:\w\aimaster-desktop
          pnpm --filter @aimaster/desktop exec electron-builder --win nsis --x64 --publish ${{ steps.pub.outputs.flag }}

      - name: List build outputs
        run: |
          cd D:\w\aimaster-desktop\apps\desktop\out
          Get-ChildItem -File | ForEach-Object { Write-Host "  $($_.Name)  ($([math]::Round($_.Length/1MB, 2)) MB)" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Louver-Mastering-AI-windows
          # Junction is transparent — files written under D:\w\... are also
          # visible under $GITHUB_WORKSPACE\... so the relative path works.
          path: |
            aimaster-desktop/apps/desktop/out/*.exe
            aimaster-desktop/apps/desktop/out/latest.yml
          if-no-files-found: error
          retention-days: 30

  # ── Release draft + artifact attach ─────────────────────────────────────────
  # Tag (v*) push 시에만 실행.  3 개 platform job 이 모두 성공해야 트리거.
  # build-* job 의 actions/upload-artifact 단계는 build job 안에서 끝나므로
  # 본 release-draft job 이 실패해도 build artifact 자체는 그대로 보존됨
  # (Actions UI 의 "Artifacts" 탭에서 다운로드 가능).
  release-draft:
    # Trigger paths:
    #   1. tag push (refs/tags/v*)              → tag_name = github.ref_name
    #   2. workflow_dispatch + release_tag 입력 → tag_name = inputs.release_tag
    # workflow_dispatch 인데 release_tag 가 비어 있으면 release 단계는 skip
    # 되고 build artifact 만 남는다 (build-* job 에서 이미 업로드 완료).
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    needs: [build-linux, build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write    # softprops/action-gh-release 가 release 생성에 필요
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: Louver-Mastering-AI-linux
          path: artifacts/linux

      - name: Download macOS zips (arm64 + x64)
        uses: actions/download-artifact@v4
        with:
          name: Louver-Mastering-AI-mac
          path: artifacts/mac

      - name: Download Windows NSIS installer
        uses: actions/download-artifact@v4
        with:
          name: Louver-Mastering-AI-windows
          path: artifacts/win

      - name: Inspect downloaded artifacts
        run: |
          echo "── linux ──"; ls -lah artifacts/linux/ || true
          echo "── mac ──";   ls -lah artifacts/mac/   || true
          echo "── win ──";   ls -lah artifacts/win/   || true

      # body_path 가 가리키는 RELEASE_DRAFT 파일은 tag 시점의 repo 상태에서
      # 읽힌다.  draft=true / prerelease=true 로 만들어 manual sign-off 전까지
      # publish 되지 않음.
      - name: Resolve release tag
        id: resolve_tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (draft + prerelease)
        uses: softprops/action-gh-release@v2
        with:
          tag_name:               ${{ steps.resolve_tag.outputs.tag }}
          name:                   ${{ steps.resolve_tag.outputs.tag }}
          # v3.6.0-rc.1 — body_path uses the current major.minor's release
          # notes.  When bumping versions, copy/update RELEASE_DRAFT_v<NEW>.md
          # and change this line to match the new tag.
          body_path:              aimaster-desktop/docs/RELEASE_DRAFT_v3.6.0.md
          draft:                  true
          # RC builds are pre-releases.  Flip to false once v3.6.0 final
          # is signed off (and bump body_path / tag accordingly).
          prerelease:             true
          fail_on_unmatched_files: true
          # workflow_dispatch 트리거 시 tag 가 아직 없으면 softprops 가
          # 현재 commit (workflow run 의 SHA) 에서 자동으로 tag 를 생성한다.
          target_commitish:       ${{ github.sha }}
          files: |
            artifacts/linux/*.AppImage
            artifacts/linux/*.deb
            artifacts/mac/*.zip
            artifacts/win/*.exe
