name: Build Louver Mastering AI

on:
  push:
    branches:
      - claude/fix-electron-black-screen-uh3ll
      - main
  workflow_dispatch:   # 수동 실행 버튼

jobs:
  # ── macOS (arm64 + x64 DMG) ──────────────────────────────────────────────────
  build-mac:
    runs-on: macos-14   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install Python dependencies + PyInstaller
        working-directory: aimaster-desktop/services/python-audio
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -r requirements.txt
          .venv/bin/pip install -q pyinstaller

      - name: Build Python engine (PyInstaller)
        working-directory: aimaster-desktop/services/python-audio
        run: |
          mkdir -p ../../apps/desktop/public/bin
          .venv/bin/pyinstaller \
            --clean --noconfirm --onefile --name engine \
            --distpath ../../apps/desktop/public/bin \
            --workpath /tmp/pyinstaller-build \
            --specpath /tmp/pyinstaller-spec \
            --hidden-import soundfile \
            --hidden-import numpy \
            --collect-all soundfile \
            --collect-all numpy \
            --exclude-module tkinter \
            --exclude-module pytest \
            --exclude-module matplotlib \
            app/main.py
          chmod +x ../../apps/desktop/public/bin/engine

      - name: Install Node dependencies
        working-directory: aimaster-desktop
        run: pnpm install --no-frozen-lockfile

      - name: Copy FFmpeg binaries
        working-directory: aimaster-desktop/apps/desktop
        run: node scripts/prebuild.cjs

      - name: Build Electron app
        working-directory: aimaster-desktop/apps/desktop
        run: pnpm build

      - name: Package DMG (arm64 + x64)
        working-directory: aimaster-desktop/apps/desktop
        run: pnpm exec electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # 서명 없이 빌드

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Louver-Mastering-AI-mac
          path: |
            aimaster-desktop/apps/desktop/out/*.dmg
          retention-days: 30

  # ── Windows (NSIS .exe) ───────────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      # Enable Windows long path support BEFORE checkout so git + later steps
      # can handle paths > 260 chars.  Some packaging tools (notably NSIS via
      # electron-builder) cannot read paths above MAX_PATH; combining this with
      # node-linker=hoisted (set below) gives us belt-and-suspenders coverage.
      - name: Enable Windows long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
          git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install Python dependencies + PyInstaller
        working-directory: aimaster-desktop/services/python-audio
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt
          .venv\Scripts\pip install pyinstaller

      - name: Build Python engine (PyInstaller)
        working-directory: aimaster-desktop/services/python-audio
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "..\..\apps\desktop\public\bin" | Out-Null
          # workpath/specpath must be on same drive as source (D:\ in GitHub Actions)
          $tmpBuild = Join-Path $env:RUNNER_TEMP "pyinstaller-build"
          $tmpSpec  = Join-Path $env:RUNNER_TEMP "pyinstaller-spec"
          .venv\Scripts\pyinstaller `
            --clean --noconfirm --onefile --name engine `
            "--distpath=..\..\apps\desktop\public\bin" `
            "--workpath=$tmpBuild" `
            "--specpath=$tmpSpec" `
            --hidden-import soundfile `
            --hidden-import numpy `
            --collect-all soundfile `
            --collect-all numpy `
            --exclude-module tkinter `
            --exclude-module pytest `
            --exclude-module matplotlib `
            app\main.py

      - name: Install Node dependencies (hoisted layout for Windows MAX_PATH)
        working-directory: aimaster-desktop
        shell: pwsh
        run: |
          # Force hoisted node_modules + short virtual-store dir name as CLI
          # overrides in case .npmrc isn't honored.  Without this, electron-builder's
          # NSIS step blows past Windows' 260-char path limit on
          #   node_modules/.pnpm/app-builder-lib@<long-peers-hash>/...
          pnpm install --no-frozen-lockfile `
            --config.node-linker=hoisted `
            --config.shamefully-hoist=true `
            --config.virtual-store-dir-max-length=64
          # Debug — confirm settings actually applied
          Write-Host "── pnpm config (Windows) ──"
          pnpm config get node-linker
          pnpm config get virtual-store-dir-max-length
          Write-Host "── app-builder-lib resolved location ──"
          $resolved = node -e "console.log(require.resolve('app-builder-lib/package.json'))"
          Write-Host $resolved
          Write-Host "── path length: $($resolved.Length) chars ──"

      - name: Copy FFmpeg binaries
        working-directory: aimaster-desktop/apps/desktop
        run: node scripts/prebuild.cjs

      - name: Build Electron app
        working-directory: aimaster-desktop/apps/desktop
        run: pnpm build

      - name: Package NSIS installer
        working-directory: aimaster-desktop/apps/desktop
        run: pnpm exec electron-builder --win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Louver-Mastering-AI-windows
          path: |
            aimaster-desktop/apps/desktop/out/*.exe
          retention-days: 30
