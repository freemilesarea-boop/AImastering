# Builds the apps/mobile (Capacitor) Android app.
#
# Mastering is 100% ON-DEVICE (Web Audio API) — no server, no Render, works
# fully offline / airplane-mode. The debug APK is the fast on-device
# verification artifact: it installs on any device (adb install / sideload),
# needs NO secrets, and exercises the exact local mastering pipeline.
#
# Always: web build -> regenerate android/ (it is gitignored) -> assembleDebug
#         -> upload the debug APK as an artifact (no secrets required).
# Optional (only when the matching secrets exist):
#   - signed release APK + AAB for Play internal test (ANDROID_KEYSTORE_* secrets)
#   - Firebase App Distribution (FIREBASE_APP_ID + FIREBASE_SERVICE_ACCOUNT)
#
# Scope: mobile app only. Does NOT touch the desktop build (build.yml),
# the python-audio engine, the server API, or any payment/account/iOS code.
name: Build Mobile Android (test app)

on:
  push:
    branches:
      - claude/gifted-babbage-6bd4gc
    paths:
      - 'aimaster-desktop/apps/mobile/**'
      - '.github/workflows/build-mobile-android.yml'
  pull_request:
    paths:
      - 'aimaster-desktop/apps/mobile/**'
      - '.github/workflows/build-mobile-android.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName (e.g. 1.0.0) for the release build'
        required: false
        default: '1.0.0'
      version_code:
        description: 'versionCode (integer). Defaults to the run number.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

env:
  MOBILE_DIR: aimaster-desktop/apps/mobile

jobs:
  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: aimaster-desktop/pnpm-lock.yaml

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: aimaster-desktop
        run: pnpm install --frozen-lockfile

      - name: Build web assets (Vite)
        working-directory: ${{ env.MOBILE_DIR }}
        env:
          # Mastering is on-device (Web Audio API) — NO server/Render env is
          # injected. The app works with no network and no backend.
          VITE_APP_VERSION: ${{ github.event.inputs.version_name || '1.0.0' }}
        run: pnpm run build

      - name: Add Android platform (android/ is gitignored — regenerate)
        working-directory: ${{ env.MOBILE_DIR }}
        run: pnpm exec cap add android

      - name: Sync Capacitor (web assets + plugins)
        working-directory: ${{ env.MOBILE_DIR }}
        run: pnpm exec cap sync android

      - name: Generate app icons (adaptive + launcher) — android/ is regenerated each build
        working-directory: ${{ env.MOBILE_DIR }}
        run: |
          pnpm exec capacitor-assets generate --android
          node fix-adaptive-bg.cjs   # full-bleed gradient background (no inset)

      - name: Set Android version (android/ is regenerated each build)
        working-directory: ${{ env.MOBILE_DIR }}/android
        env:
          VNAME: ${{ github.event.inputs.version_name || '1.0.0' }}
          VCODE: ${{ github.event.inputs.version_code || github.run_number }}
        run: |
          sed -i -E "s/versionCode .*/versionCode ${VCODE}/" app/build.gradle
          sed -i -E "s/versionName \".*\"/versionName \"${VNAME}\"/" app/build.gradle
          echo "version: ${VNAME} (${VCODE})"
          grep -E "versionCode|versionName" app/build.gradle

      - name: Bump Android SDK to 35 (Play targetSdk policy)
        working-directory: ${{ env.MOBILE_DIR }}
        run: |
          node patch-android-sdk.cjs
          grep -E "compileSdkVersion|targetSdkVersion|minSdkVersion" android/variables.gradle

      - name: Accept Android SDK licenses + ensure API 35
        run: |
          SDK="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          yes | "$SDK" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      # ── Debug APK (always) ──────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: ${{ env.MOBILE_DIR }}/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.MOBILE_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ── Detect optional secrets ─────────────────────────────────────────────
      - name: Detect optional secrets
        id: flags
        run: |
          # Diagnostic: which signing secrets are visible (booleans only, no values).
          echo "ANDROID_KEYSTORE_BASE64 set:   ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}"
          echo "ANDROID_KEYSTORE_PASSWORD set: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}"
          echo "ANDROID_KEY_ALIAS set:         ${{ secrets.ANDROID_KEY_ALIAS != '' }}"
          echo "ANDROID_KEY_PASSWORD set:      ${{ secrets.ANDROID_KEY_PASSWORD != '' }}"
          echo "sign=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"
          echo "firebase=${{ secrets.FIREBASE_APP_ID != '' && secrets.FIREBASE_SERVICE_ACCOUNT != '' }}" >> "$GITHUB_OUTPUT"

      # ── Signed release APK + AAB (optional) ─────────────────────────────────
      - name: Decode keystore
        if: steps.flags.outputs.sign == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${RUNNER_TEMP}/release.jks"

      - name: Build & sign release (APK + AAB)
        if: steps.flags.outputs.sign == 'true'
        working-directory: ${{ env.MOBILE_DIR }}/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
          BT="$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)"
          echo "Using build-tools: $BT"
          "$BT/apksigner" sign \
            --ks "${RUNNER_TEMP}/release.jks" \
            --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/apksigner" verify --verbose app/build/outputs/apk/release/app-release-signed.apk
          jarsigner -keystore "${RUNNER_TEMP}/release.jks" \
            -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"

      - name: Upload signed release artifacts
        if: steps.flags.outputs.sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: |
            ${{ env.MOBILE_DIR }}/android/app/build/outputs/apk/release/app-release-signed.apk
            ${{ env.MOBILE_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # ── Firebase App Distribution (optional) ────────────────────────────────
      - name: Distribute to Firebase App Distribution
        if: steps.flags.outputs.firebase == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
          releaseNotes: "Android test build ${{ github.sha }}"
          file: ${{ env.MOBILE_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
